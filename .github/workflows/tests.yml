name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '11'
            testbench: '^9.0'

          - php: '8.3'
            laravel: '11'
            testbench: '^9.0'

          - php: '8.4'
            laravel: '11'
            testbench: '^9.0'

          - php: '8.2'
            laravel: '12'
            testbench: '^10.0'

          - php: '8.3'
            laravel: '12'
            testbench: '^10.0'

          - php: '8.4'
            laravel: '12'
            testbench: '^10.0'

          - php: '8.3'
            laravel: '13'
            testbench: '^11.0'

          - php: '8.4'
            laravel: '13'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Configure Testbench
        run: |
          composer require --dev \
            "orchestra/testbench:${{ matrix.testbench }}" \
            --no-update \
            --no-interaction

      - name: Install dependencies
        run: |
          composer update \
            --with "illuminate/contracts:^${{ matrix.laravel }}.0" \
            --with "illuminate/http:^${{ matrix.laravel }}.0" \
            --with "illuminate/support:^${{ matrix.laravel }}.0" \
            --prefer-dist \
            --no-interaction \
            --no-progress

      - name: Show installed versions
        run: |
          php --version
          composer --version
          composer show orchestra/testbench
          composer show laravel/framework

      - name: Run syntax checks
        run: composer lint

      - name: Run tests
        run: composer test
